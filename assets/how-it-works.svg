<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">How Shortly works</title><desc id="desc">Sign in with Google, paste an HTTP or HTTPS URL, save a short link owned by your account in MongoDB Atlas, and share it. Account history is private. Anyone with a short link can follow its public redirect. LINK_RETENTION_DAYS controls expiry; expired links return 404 and are deleted by daily or request-triggered cleanup.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="m0 0 8 4-8 4" fill="none" stroke="#a89aff" stroke-width="1.5"/></marker></defs><rect width="1200" height="860" rx="24" fill="#10141d"/><g font-family="Arial, Helvetica, sans-serif"><text x="48" y="53" fill="#a89aff" font-size="12" font-weight="700">SHORTLY / HOW IT WORKS</text><text x="48" y="106" fill="#eef2ff" font-size="36" font-weight="700">Small links. Your own space.</text><text x="48" y="140" fill="#9ba5b9" font-size="17" font-weight="400">Google sign-in · Private account history · Configurable link expiry</text><rect x="48" y="184" width="258" height="226" rx="16" fill="#191f2d" stroke="#303a4d"/><rect x="68" y="204" width="38" height="32" rx="9" fill="#29273d" stroke="#29273d"/><text x="77" y="226" fill="#c3b9ff" font-size="13" font-weight="700">01</text><text x="68" y="274" fill="#eef2ff" font-size="18" font-weight="700">Sign in with Google</text><text x="68" y="310" fill="#9ba5b9" font-size="14" font-weight="400">Google verifies your identity.</text><text x="68" y="335" fill="#9ba5b9" font-size="14" font-weight="400">A secure session keeps</text><text x="68" y="360" fill="#9ba5b9" font-size="14" font-weight="400">you signed in.</text><path d="M310 292H326" fill="none" stroke="#a89aff" stroke-width="2" marker-end="url(#arrow)"/><rect x="330" y="184" width="258" height="226" rx="16" fill="#191f2d" stroke="#303a4d"/><rect x="350" y="204" width="38" height="32" rx="9" fill="#29273d" stroke="#29273d"/><text x="359" y="226" fill="#c3b9ff" font-size="13" font-weight="700">02</text><text x="350" y="274" fill="#eef2ff" font-size="18" font-weight="700">Paste your long URL</text><text x="350" y="310" fill="#9ba5b9" font-size="14" font-weight="400">The Express API checks</text><text x="350" y="335" fill="#9ba5b9" font-size="14" font-weight="400">your session and validates</text><text x="350" y="360" fill="#9ba5b9" font-size="14" font-weight="400">the HTTP(S) destination.</text><path d="M592 292H608" fill="none" stroke="#a89aff" stroke-width="2" marker-end="url(#arrow)"/><rect x="612" y="184" width="258" height="226" rx="16" fill="#191f2d" stroke="#303a4d"/><rect x="632" y="204" width="38" height="32" rx="9" fill="#29273d" stroke="#29273d"/><text x="641" y="226" fill="#c3b9ff" font-size="13" font-weight="700">03</text><text x="632" y="274" fill="#eef2ff" font-size="18" font-weight="700">Create a short link</text><text x="632" y="310" fill="#9ba5b9" font-size="14" font-weight="400">A random code and its URL</text><text x="632" y="335" fill="#9ba5b9" font-size="14" font-weight="400">are saved in MongoDB Atlas,</text><text x="632" y="360" fill="#9ba5b9" font-size="14" font-weight="400">owned by your account.</text><path d="M874 292H890" fill="none" stroke="#a89aff" stroke-width="2" marker-end="url(#arrow)"/><rect x="894" y="184" width="258" height="226" rx="16" fill="#191f2d" stroke="#303a4d"/><rect x="914" y="204" width="38" height="32" rx="9" fill="#29273d" stroke="#29273d"/><text x="923" y="226" fill="#c3b9ff" font-size="13" font-weight="700">04</text><text x="914" y="274" fill="#eef2ff" font-size="18" font-weight="700">Copy and share</text><text x="914" y="310" fill="#9ba5b9" font-size="14" font-weight="400">See your private history</text><text x="914" y="335" fill="#9ba5b9" font-size="14" font-weight="400">on any device. Copy a link</text><text x="914" y="360" fill="#9ba5b9" font-size="14" font-weight="400">and send it to someone.</text><rect x="48" y="439" width="1104" height="132" rx="16" fill="#191f2d" stroke="#303a4d"/><text x="72" y="471" fill="#a89aff" font-size="11" font-weight="700">WHEN SOMEONE OPENS A SHARED LINK</text><text x="72" y="512" fill="#eef2ff" font-size="18" font-weight="700">Anyone with the link</text><path d="M279 506H331" fill="none" stroke="#a89aff" stroke-width="2" marker-end="url(#arrow)"/><text x="351" y="512" fill="#eef2ff" font-size="18" font-weight="700">Shortly / :code</text><path d="M510 506H562" fill="none" stroke="#a89aff" stroke-width="2" marker-end="url(#arrow)"/><text x="582" y="512" fill="#eef2ff" font-size="18" font-weight="700">Active link → original URL</text><text x="582" y="542" fill="#9ba5b9" font-size="13" font-weight="400">HTTP 302 redirect · No sign-in required to open a link</text><rect x="48" y="598" width="538" height="184" rx="16" fill="#191f2d" stroke="#303a4d"/><rect x="610" y="598" width="542" height="184" rx="16" fill="#191f2d" stroke="#303a4d"/><text x="72" y="635" fill="#a89aff" font-size="12" font-weight="700">PRIVATE HISTORY</text><text x="72" y="670" fill="#eef2ff" font-size="18" font-weight="700">Only your account can list your links.</text><text x="72" y="701" fill="#9ba5b9" font-size="15" font-weight="400">The same URL shortened by two people gets</text><text x="72" y="725" fill="#9ba5b9" font-size="15" font-weight="400">separate short links. Shared redirects remain public.</text><text x="634" y="635" fill="#a89aff" font-size="12" font-weight="700">LINK_RETENTION_DAYS</text><text x="634" y="670" fill="#eef2ff" font-size="17" font-weight="700">0 = keep forever    ·    30 = expire after 30 days</text><text x="634" y="701" fill="#9ba5b9" font-size="15" font-weight="400">Expired links return 404 immediately. Records are</text><text x="634" y="725" fill="#9ba5b9" font-size="15" font-weight="400">deleted by daily cron or during create/list requests.</text><text x="634" y="755" fill="#b9ae83" font-size="12" font-weight="400">Policy applies to existing links too; deletion is permanent.</text><text x="48" y="823" fill="#9ba5b9" font-size="11" font-weight="700">REACT + TAILWIND</text><text x="445" y="823" fill="#9ba5b9" font-size="11" font-weight="700">EXPRESS ON VERCEL</text><text x="962" y="823" fill="#9ba5b9" font-size="11" font-weight="700">MONGODB ATLAS</text></g></svg>